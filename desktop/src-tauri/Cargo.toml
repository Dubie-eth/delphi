[package]
name = "delphi-desktop-node"
version = "0.1.0"
description = "Delphi Genesis desktop node (testnet)"
authors = ["Delphi"]
edition = "2021"

[lib]
name = "delphi_desktop_node_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "=2.2.0"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
